name: Publish static SEO pages to root
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: publish-root
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: node scripts/publish-root.mjs
      - name: Commit synced static routes for root-directory deployments
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html privacy.html robots.txt sitemap.xml 404.html services/ about/ partners/ nassau-paradise-island-concierge/ private-aviation-arrivals-bahamas/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish static concierge SEO pages'
            git push origin HEAD:main
          fi
